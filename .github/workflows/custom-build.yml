name: Albert Iosevka Custom Build

on:
  push:
    branches:
      - main
  workflow_dispatch: # 允许手动触发该工作流

env:
  FUSION_DEVELOPER: Albert
  FUSION_COPYRIGHT: Copyright 2025-2026, Albert (${{ github.server_url }}/${{ github.repository }})
  FUSION_LICENSE: "This Font Software is licensed under the SIL Open Font License, Version 1.1. This license is available with a FAQ at: https://openfontlicense.org"
  IOSEVKA_COPYRIGHT: Copyright 2015-2026, Renzhi Li (aka. Belleve Invis, belleve@typeof.net).
  FUSION_VERSION: LXGW v1.530; Iosevka 34.9.1; ttfautohint (v1.8.4); Nerd Fonts 3.5.1
  LXGW_COPYRIGHT: Copyright 2021-2026 LXGW (https://github.com/lxgw/LxgwWenKai-Lite). Copyright 2020 The Klee Project Authors (https://github.com/fontworks-fonts/Klee)
  LXGW_WENKAI_LITE: https://github.com/lxgw/LxgwWenKai-Lite/releases/download/v1.530/LXGWWenKaiMonoLite-Regular.ttf
  SS05_NAME: IosevkaTermSS05 Nerd Font Mono + LXGW WenKai Mono Lite
  SS05_ID: IosevkaTermSS05NFM+LXGWWenKaiMonoLite
  SS05: IosevkaTermSS05

jobs:
  build:
    name: Build ${{ matrix.fontName }} font
    if: github.repository == 'EK5606/Iosevka'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        fontName: ["IosevkaTermSS05"]

    steps:
      # Checkout repository into `iosevka` sub directory
      - uses: actions/checkout@v6
        with:
          path: iosevka

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          # GitHub Runner 偶尔会 DNS 解析失败，失败后自动重试
          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 5 ]; then
                echo "Command failed after $attempt attempts: $*" >&2
                return 1
              fi
              attempt=$((attempt + 1))
              echo "Attempt $((attempt - 1))/5 failed, retrying in 10s..."
              sleep 10
            done
          }

          retry sudo apt-get -o Acquire::Retries=5 update
          retry sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends ttfautohint
          retry sudo apt-get -o Acquire::Retries=5 install -y fontforge python3-fontforge python3-fonttools p7zip jq gftools

      - name: Download Nerd Font Patcher
        run: |
          wget -q --tries=5 --retry-connrefused --waitretry=5 https://github.com/ryanoasis/nerd-fonts/raw/refs/heads/master/FontPatcher.zip
          unzip FontPatcher.zip

      - name: Build Font ${{ matrix.fontName }}
        shell: bash
        working-directory: iosevka
        run: |
          npm install
          npm run build -- ttf::${{ matrix.fontName }}

      - name: Patch Iosevka
        run: |
          for STYLE in Regular Bold Italic BoldItalic; do
            ./font-patcher --quiet --adjust-line-height --complete --careful -s iosevka/dist/${SS05}/TTF/${SS05}-${STYLE}.ttf
          done

      - name: Download LXGWWenKaiMonoLite
        run: |
          wget -q --tries=5 --retry-connrefused --waitretry=5 ${LXGW_WENKAI_LITE}

      - name: Download width.py & fuse_fonts.ff
        run: |
          wget -q --tries=5 --retry-connrefused --waitretry=5 https://github.com/georgealbert/MyNerdFonts/raw/refs/heads/main/width.py
          wget -q --tries=5 --retry-connrefused --waitretry=5 https://github.com/georgealbert/MyNerdFonts/raw/refs/heads/main/fuse_fonts.ff

      - name: Merge font by FontForge
        shell: bash
        run: |
          # 中文字体始终使用 LXGW Regular
          for STYLE in Regular Bold Italic "Bold Italic"; do
            SUFFIX="${STYLE// /}"

            fontforge "fuse_fonts.ff" \
              "LXGWWenKaiMonoLite-Regular.ttf" \
              "${SS05}NerdFontMono-${SUFFIX}.ttf" \
              "$SS05_ID-$SUFFIX" \
              "$SS05_NAME" \
              "$SS05_NAME $STYLE" \
              "$STYLE" \
              "$SS05_ID-${SUFFIX}.ttf"
          done

      - name: Set tag name env
        run: |
          echo "NOW=v$(TZ='Asia/Shanghai' date +'%Y%m%d.%H%M%S')" >> $GITHUB_ENV

      - name: Fix Iosevka and merged font
        run: |
          # Fix Iosevka font agvCharWidth.
          for STYLE in Regular Bold Italic BoldItalic; do
            python width.py -f 520 ${SS05}NerdFontMono-${STYLE}.ttf -l -200 -n 30
          done

          for STYLE in Regular Bold Italic BoldItalic; do
            python width.py -m ${SS05_ID}-${STYLE}.ttf -o 1000 -t 1040 > /dev/null
            python width.py -m ${SS05_ID}-${STYLE}-w1040.ttf -o 500 -t 520 > /dev/null
            mv ${SS05_ID}-${STYLE}-w1040-w520.ttf ${SS05_ID}-${STYLE}.ttf
            python width.py -f 520 ${SS05_ID}-${STYLE}.ttf -l -200 -n 30 -a 1040

            gftools update-nameids "${SS05_ID}-${STYLE}.ttf" \
              --uniqueid "$SS05_ID-$STYLE-$NOW" \
              --designer "$FUSION_DEVELOPER" \
              --manufacturer "$FUSION_DEVELOPER" \
              --trademark "$SS05_NAME" \
              --version "$NOW; $FUSION_VERSION" \
              --copyright "$(echo -e "$IOSEVKA_COPYRIGHT\n$LXGW_COPYRIGHT\n$FUSION_COPYRIGHT")" \
              --license "$FUSION_LICENSE" \
              --urlvendor "${{ github.server_url }}/${{ github.repository }}" \
              --urldesigner "https://www.albertzhou.net" \
              --urllicense "https://openfontlicense.org"
            mv "${SS05_ID}-${STYLE}.ttf.fix" "${SS05_ID}-${STYLE}.ttf"
          done

      - name: Generate artifact info
        run: |
          echo 'release_body<<EOF' >> $GITHUB_ENV
          cd iosevka && git log -1 --oneline >> $GITHUB_ENV
          cd ..

          # Print font info.
          echo "# Font Info:" >> $GITHUB_ENV
          for STYLE in Regular Bold Italic BoldItalic; do
            echo "" >> $GITHUB_ENV
            echo "* ${SS05_ID}-${STYLE}.ttf:" >> $GITHUB_ENV
            echo "\`\`\`" >> $GITHUB_ENV
            python width.py -c ${SS05_ID}-${STYLE}.ttf >> $GITHUB_ENV
            echo "\`\`\`" >> $GITHUB_ENV
          done

          echo 'EOF' >> $GITHUB_ENV

          echo ${{ env.release_body }}
          
      - name: Publish Release
        id: publish_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.NOW }}
          draft: false
          prerelease: false
          body: >
            针对原版`Iosevka`字体过于瘦高进行了下面的优化：

            1. `Iosevka`字体参考`FiraCode`风格，调整了i、r、l、t和1、4、0等数字的样式。

            2. 加宽了`Iosevka`字体，宽度从默认的`500`增加到`520`，中文相应的从`1000`增加到`1040`，保持等宽。

            3. `Iosevka`字体编译时使能`TXTR`特性，即Monaspace字体的`text healing`。

            4. 中文字体是[霞鹜文楷Lite等宽](${{ env.LXGW_WENKAI_LITE }})，各字重均使用 Regular。

            5. FiraCode风格中英文合并字体（常规、粗体、斜体、粗斜体）：[${{ env.SS05_ID }}-Regular.ttf](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.NOW }}/${{ env.SS05_ID }}-Regular.ttf)、[${{ env.SS05_ID }}-Bold.ttf](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.NOW }}/${{ env.SS05_ID }}-Bold.ttf)、[${{ env.SS05_ID }}-Italic.ttf](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.NOW }}/${{ env.SS05_ID }}-Italic.ttf)、[${{ env.SS05_ID }}-BoldItalic.ttf](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.NOW }}/${{ env.SS05_ID }}-BoldItalic.ttf)。

            ![IosevkaTermSS05NFM+LXGWWenKaiMonoLite-Regular-demo](https://github.com/georgealbert/MyNerdFonts/blob/main/screenshots/IosevkaTermSS05NFM%2BLXGWWenKaiMonoLite-Regular-demo.png)
            Iosevka原版和改版对比：
            ![Iosevka_diff](https://github.com/georgealbert/MyNerdFonts/blob/main/screenshots/character.png)

            ${{ env.release_body }}


            Built with
            [Github Workflow #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          files: |
            ${{ env.SS05_ID }}-Regular.ttf
            ${{ env.SS05_ID }}-Bold.ttf
            ${{ env.SS05_ID }}-Italic.ttf
            ${{ env.SS05_ID }}-BoldItalic.ttf
